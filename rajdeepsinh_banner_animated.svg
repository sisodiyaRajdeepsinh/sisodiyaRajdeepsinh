<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <clipPath id="mainClip"><rect width="900" height="300"/></clipPath>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightBlend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC0000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#990000" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="yellowGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.07)"/>
    </pattern>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <g clip-path="url(#mainClip)">

    <!-- BG red pulse -->
    <rect width="900" height="300" fill="#CC0000">
      <animate attributeName="fill" values="#CC0000;#B80000;#CC0000" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Texture -->
    <rect width="900" height="300" fill="url(#dots)"/>
    <rect width="900" height="300" fill="url(#grid)"/>

    <!-- Right side darker panel -->
    <rect x="580" y="0" width="320" height="300" fill="rgba(0,0,0,0.18)"/>

    <!-- Decorative circles right side (like abstract figure) -->
    <circle cx="760" cy="110" r="90" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1">
      <animate attributeName="r" values="90;96;90" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="110" r="60" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="760" cy="110" r="30" fill="rgba(245,184,0,0.10)" stroke="rgba(245,184,0,0.2)" stroke-width="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Diagonal slash lines right (energy effect) -->
    <line x1="640" y1="0" x2="580" y2="300" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <line x1="700" y1="0" x2="640" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
    <line x1="760" y1="0" x2="700" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="820" y1="0" x2="760" y2="300" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="880" y1="0" x2="820" y2="300" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

    <!-- Animated energy slash -->
    <line x1="900" y1="0" x2="840" y2="300" stroke="rgba(245,184,0,0.5)" stroke-width="2">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="900;860;900" dur="2.5s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="840;800;840" dur="2.5s" begin="2s" repeatCount="indefinite"/>
    </line>

    <!-- Shine sweep -->
    <rect x="-200" y="0" width="160" height="300" fill="url(#shineGrad)">
      <animate attributeName="x" from="-200" to="1100" dur="3s" begin="2.2s" repeatCount="indefinite"/>
    </rect>

    <!-- Left vertical bar -->
    <rect x="38" y="28" width="4" height="0" fill="white" rx="2">
      <animate attributeName="height" from="0" to="150" dur="0.5s" begin="0.1s" fill="freeze"/>
    </rect>

    <!-- AI / ML DEV badge -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="-180,0" to="0,0" dur="0.4s" begin="0.2s" fill="freeze"/>
      <rect x="50" y="24" width="140" height="30" rx="5" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2"/>
      <text x="120" y="44" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="14" fill="white" letter-spacing="2" font-weight="900">AI / ML DEV</text>
    </g>

    <!-- RAJDEEPSINH -->
    <text x="46" y="148" font-family="Arial Black, Impact, sans-serif" font-size="88" font-weight="900" fill="white" letter-spacing="-1" opacity="0" filter="url(#glow)">RAJDEEPSINH
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,-60" to="0,0" dur="0.45s" begin="0.5s" fill="freeze" additive="sum"/>
    </text>

    <!-- SISODIYA gold pulse -->
    <text x="46" y="222" font-family="Arial Black, Impact, sans-serif" font-size="88" font-weight="900" fill="#F5B800" letter-spacing="-1" opacity="0" filter="url(#yellowGlow)">SISODIYA
      <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.78s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0,60" to="0,0" dur="0.45s" begin="0.78s" fill="freeze" additive="sum"/>
      <animate attributeName="fill" values="#F5B800;#FFD700;#F5B800" dur="2.5s" begin="1.5s" repeatCount="indefinite"/>
    </text>

    <!-- Subtitle -->
    <text x="46" y="248" font-family="Arial Black, Impact, sans-serif" font-size="14" fill="white" letter-spacing="2.5" font-weight="900" opacity="0">COMPUTER VISION  •  DEEP LEARNING  •  OPENCV
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    </text>

    <!-- Divider line draws across -->
    <line x1="46" y1="258" x2="46" y2="258" stroke="white" stroke-width="1.2" opacity="0">
      <animate attributeName="x2" from="46" to="640" dur="0.6s" begin="1.2s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="0.5" dur="0.2s" begin="1.2s" fill="freeze"/>
    </line>

    <!-- Bottom bar slides up -->
    <rect x="0" y="300" width="900" height="42" fill="rgba(0,0,0,0.35)">
      <animate attributeName="y" from="300" to="258" dur="0.4s" begin="1.3s" fill="freeze"/>
    </rect>

    <!-- Bottom content -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.55s" fill="freeze"/>

      <circle cx="62" cy="279" r="13" fill="none" stroke="white" stroke-width="1.8"/>
      <text x="62" y="284" text-anchor="middle" font-family="Arial" font-size="12" fill="white">★</text>
      <text x="83" y="276" font-family="Arial Black, sans-serif" font-size="10" fill="white" font-weight="900" letter-spacing="0.8">OPEN TO OPPORTUNITIES</text>

      <line x1="248" y1="263" x2="248" y2="295" stroke="white" stroke-width="0.8" opacity="0.5"/>

      <circle cx="265" cy="279" r="13" fill="none" stroke="white" stroke-width="1.8"/>
      <text x="265" y="284" text-anchor="middle" font-family="Arial" font-size="11" fill="white">◎</text>
      <text x="286" y="276" font-family="Arial Black, sans-serif" font-size="10" fill="white" font-weight="900" letter-spacing="0.8">AHMEDABAD, INDIA</text>

      <line x1="430" y1="263" x2="430" y2="295" stroke="white" stroke-width="0.8" opacity="0.5"/>

      <circle cx="447" cy="279" r="13" fill="none" stroke="white" stroke-width="1.8"/>
      <text x="447" y="284" text-anchor="middle" font-family="Arial" font-size="13" fill="white">⊙</text>
      <text x="468" y="276" font-family="Arial Black, sans-serif" font-size="10" fill="white" font-weight="900" letter-spacing="0.8">github.com/sisodiyaRajdeepsinh</text>
    </g>

    <!-- Pulsing star -->
    <circle cx="62" cy="279" r="4" fill="#F5B800" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1.7s" fill="freeze"/>
      <animate attributeName="r" values="4;7;4" dur="1.8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Impact flashes -->
    <rect width="900" height="300" fill="white" opacity="0">
      <animate attributeName="opacity" values="0;0.22;0" dur="0.25s" begin="0.5s"/>
    </rect>
    <rect width="900" height="300" fill="white" opacity="0">
      <animate attributeName="opacity" values="0;0.16;0" dur="0.25s" begin="0.78s"/>
    </rect>

  </g>
</svg>
